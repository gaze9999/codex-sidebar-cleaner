name: Build portable CLI

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'push' || github.event.created
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: macos-15-intel
            label: macos-x64
          - os: macos-15
            label: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Test isolated fixtures
        run: python -X utf8 -m unittest discover -t . -s tests
      - name: Install CI build dependencies
        run: python -m pip install -r tools/build-requirements.txt
      - name: Build and smoke test native portable package
        run: python tools/build_release.py
      - uses: actions/upload-artifact@v7
        with:
          name: portable-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  attach-release:
    if: (github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')) && !startsWith(github.event.release.tag_name || github.ref_name, 'v0.')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: portable-*
          path: dist
          merge-multiple: true
      - name: Publish tested packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --repo "$REPOSITORY"
          else
            gh release create "$RELEASE_TAG" dist/* --repo "$REPOSITORY" --verify-tag \
              --title "$RELEASE_TAG" \
              --notes "提供 Windows 與 macOS (Intel / Apple Silicon) 的 CLI 免安裝包與 SHA-256. [使用說明](https://github.com/$REPOSITORY/blob/$RELEASE_TAG/docs/README.md)"
          fi
