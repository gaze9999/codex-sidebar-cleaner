name: Build portable CLI

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed full-version Tag
        type: string
        required: true
      publish:
        description: Stage packages in a draft Release; never publishes it
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'push' || github.event.created
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: macos-15-intel
            label: macos-x64
          - os: macos-15
            label: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check version Tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python -c "import os,re,subprocess,sys; tag=os.environ['RELEASE_TAG']; re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', tag) or sys.exit('A full version Tag is required'); subprocess.check_output(['git','cat-file','-t','refs/tags/'+tag],text=True).strip() == 'tag' or sys.exit('An annotated Tag is required')"
        shell: pwsh
      - name: Test isolated fixtures
        run: python -X utf8 -m unittest discover -t . -s tests
      - name: Install CI build dependencies
        run: python -m pip install -r tools/build-requirements.txt
      - name: Build and smoke test native portable package
        run: python tools/build_release.py
      - uses: actions/upload-artifact@v7
        with:
          name: portable-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  attach-release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: portable-*
          path: dist
          merge-multiple: true
      - name: Prepare verified draft Release
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          TAG_OBJECT=$(git rev-parse "refs/tags/$RELEASE_TAG")
          test "$(git cat-file -t "$TAG_OBJECT")" = tag
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$TAG_OBJECT"
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > draft-state; then
            test "$(cat draft-state)" = true || { echo 'Published releases are not overwritten'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes 'Verified build assets; publish only after the complete delivery is reviewed.'
          fi
      - name: Attach tested packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/*
